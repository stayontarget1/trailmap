<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a0a0a">
  <title>TrailMap</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="assets/icons/icon.svg">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <div id="map"></div>

  <!-- Layer switcher -->
  <div id="layer-switcher" class="map-control top-right">
    <button id="layer-btn" class="control-btn" title="Layers">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polygon points="12 2 2 7 12 12 22 7 12 2"/>
        <polyline points="2 17 12 22 22 17"/>
        <polyline points="2 12 12 17 22 12"/>
      </svg>
    </button>
    <div id="layer-menu" class="control-menu hidden">
      <button class="layer-option active" data-layer="topo">Topo</button>
      <button class="layer-option" data-layer="satellite">Satellite</button>
      <button class="layer-option" data-layer="hybrid">Hybrid</button>
    </div>
  </div>

  <!-- Zoom controls -->
  <div id="zoom-controls" class="map-control right">
    <button id="zoom-in" class="control-btn" title="Zoom in">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
    </button>
    <button id="zoom-out" class="control-btn" title="Zoom out">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
    </button>
  </div>

  <!-- Compass -->
  <div id="compass-control" class="map-control top-right-below">
    <button id="compass-btn" class="control-btn" title="Reset bearing">
      <svg id="compass-arrow" width="22" height="22" viewBox="0 0 24 24" fill="none">
        <polygon points="12,2 15,14 12,12 9,14" fill="#d97706"/>
        <polygon points="12,22 9,14 12,12 15,14" fill="#666"/>
      </svg>
    </button>
  </div>

  <!-- Locate me -->
  <div id="locate-control" class="map-control right-below">
    <button id="locate-btn" class="control-btn" title="My location">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3"/>
        <line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/>
        <line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/>
      </svg>
    </button>
  </div>

  <!-- Scale bar -->
  <div id="scale-bar" class="map-control bottom-left">
    <div id="scale-line"></div>
    <span id="scale-label"></span>
  </div>

  <!-- Coordinates display -->
  <div id="coords-display" class="map-control bottom-right">
    <span id="coords-text"></span>
  </div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
